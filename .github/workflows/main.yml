name: Daily QDjob Automation

on:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:

jobs:
  run-qdjob:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          # 如果项目有其他依赖，在这里添加
      
      - name: Create cookies directory and file
        env:
          COOKIE_JSON: ${{ secrets.QD_COOKIE_JSON }}
        run: |
          mkdir -p cookies
          echo "$COOKIE_JSON" > cookies/你的用户名.json
          echo "Cookie文件已创建"
      
      - name: Run QDjob
        run: python QDjob/main.py
